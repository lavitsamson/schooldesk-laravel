name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:
  static-analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # PhpSpreadsheet (imports, exports) needs zip and gd; Money formatting intl; Horizon pcntl and posix.
          extensions: zip, gd, intl, pcntl, posix
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Translations
        run: npm run i18n:check

      # Known vulnerabilities in the locked dependencies (docs/SECURITY.md).
      - name: Dependency audit
        run: |
          composer audit --locked
          npm audit --audit-level=high

      - name: vue-tsc
        run: npm run typecheck

  tests:
    name: Pest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
          - db: pgsql
            port: 5432

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, pdo_pgsql, redis, zip, gd, intl, pcntl, posix
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vite build
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: php artisan test --coverage

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: [static-analysis]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: schooldesk
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The cache uses tags (grade scales per school), which the database store cannot do.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The journey spec follows the links in verification and invitation mails.
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ['1025:1025', '8025:8025']

    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: schooldesk
      DB_USERNAME: root
      DB_PASSWORD: password
      SESSION_DRIVER: database
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      # A test secret: the fees spec signs a simulated Stripe webhook with it (no Stripe account needed).
      STRIPE_WEBHOOK_SECRET: whsec_e2e_test_only
      E2E_STRIPE_WEBHOOK_SECRET: whsec_e2e_test_only

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, redis, zip, gd, intl, pcntl, posix
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vite build
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force --seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The production images (docker/Dockerfile) and stack (compose.prod.yaml), as deployed:
  # build, start, migrate and seed, then the smoke test a deploy runs (docs/DEPLOYMENT.md).
  production-image:
    name: Production image
    runs-on: ubuntu-latest
    needs: [static-analysis]

    env:
      ENV_FILE: .env.ci
      IMAGE_TAG: ci

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          tags: schooldesk-app:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          tags: schooldesk-web:ci
          load: true
          cache-from: type=gha,scope=app

      # The production example with throwaway secrets, plain HTTP and mail to the log.
      - name: Configure
        run: |
          sed -e "s|^SITE_ADDRESS=.*|SITE_ADDRESS=:80|" \
              -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
              -e "s|^APP_URL=.*|APP_URL=http://localhost|" \
              -e "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" \
              -e "s|^MAIL_MAILER=.*|MAIL_MAILER=log|" \
              -e "s|^DEMO_MODE=.*|DEMO_MODE=true|" \
              -e "s|change-me-too|ci-root-password|" \
              -e "s|=change-me$|=ci-password|" \
              .env.production.example > .env.ci

      - name: Start the stack
        run: docker compose -f compose.prod.yaml --env-file .env.ci up -d --no-build --wait --wait-timeout 180

      - name: Migrate and seed
        run: docker compose -f compose.prod.yaml --env-file .env.ci exec -T app php artisan migrate --force --seed

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost admin@riverside.demo DemoPass123!

      - name: Horizon and the nightly demo reset
        run: |
          docker compose -f compose.prod.yaml --env-file .env.ci exec -T horizon php artisan horizon:status
          docker compose -f compose.prod.yaml --env-file .env.ci exec -T scheduler php artisan demo:reset
          scripts/smoke-test.sh http://localhost admin@riverside.demo DemoPass123!

      - name: Logs
        if: failure()
        run: docker compose -f compose.prod.yaml --env-file .env.ci logs --tail 200
