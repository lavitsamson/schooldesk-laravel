; Production PHP settings for SchoolDesk (loaded after the image's defaults).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Student imports are limited to IMPORT_MAX_FILE_KB (5 MB by default); Nginx allows 10 MB.
upload_max_filesize = 10M
post_max_size = 12M

; The code never changes inside a running container, so opcache never re-checks files.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
date.timezone = UTC
