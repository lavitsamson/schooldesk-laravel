; PHP-FPM pool overrides (after the image's www.conf).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; For the container health check (cgi-fcgi), not reachable through Nginx.
ping.path = /fpm-ping
ping.response = pong

; Logs go to the container's output; the access log is Nginx's job.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
