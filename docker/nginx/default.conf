# Nginx in front of PHP-FPM (the `app` service). TLS ends at Caddy, which sets X-Forwarded-For
# and X-Forwarded-Proto; Laravel trusts them from TRUSTED_PROXIES only (docs/DEPLOYMENT.md).
# Security headers of PHP responses come from the app (SecurityHeaders middleware); the static
# locations set their own, as Nginx headers would otherwise be sent twice.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;

    server_tokens off;
    charset utf-8;

    # Student imports are capped at 5 MB by the app; this is the outer limit.
    client_max_body_size 10m;

    # For the container health check only.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed files never change: cache them for a year.
    location /build/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        internal;
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # Any other PHP file, and dotfiles, are never served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
