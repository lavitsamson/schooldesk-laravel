# Production stack on one Docker host (docs/DEPLOYMENT.md). Configuration is in .env.production
# (copy .env.production.example); pass it for interpolation too:
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
#
# Only Caddy publishes ports. The app image runs three roles: PHP-FPM, Horizon and the scheduler.

# Its own project name, so it never mixes with Sail's containers (compose.yaml) in the same checkout.
name: schooldesk

x-app: &app
    image: schooldesk-app:${IMAGE_TAG:-latest}
    build:
        context: .
        dockerfile: docker/Dockerfile
        target: app
    env_file: ${ENV_FILE:-.env.production}
    volumes:
        # Uploads, photos, generated PDFs and exports, shared by the web workers and Horizon.
        - storage-app:/var/www/html/storage/app
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped
    networks:
        - internal

services:
    caddy:
        image: caddy:2.10-alpine
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        environment:
            SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
            ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            web:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - internal

    web:
        image: schooldesk-web:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: web
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - internal

    app:
        <<: *app

    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        # Horizon finishes running jobs on SIGTERM; give the longest job (60 s) time to end.
        stop_grace_period: 90s
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 60s
            timeout: 10s
            start_period: 30s

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped
        networks:
            - internal

    redis:
        image: redis:7.4-alpine
        command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - internal

networks:
    internal:
        driver: bridge

volumes:
    storage-app:
    mysql-data:
    redis-data:
    caddy-data:
    caddy-config:
